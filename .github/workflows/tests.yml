name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The unit tests use fake OCR, so they need only these, not YOLO or PaddleOCR.
      - run: pip install pytest numpy opencv-python-headless
      - run: python -m pytest -q tests
