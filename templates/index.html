<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMPSA ALPR Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-400">UMPSA Campus Gate Security</h1>
            <p class="text-gray-400">Edge-AI Automated License Plate Recognition</p>
        </header>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Left Column: Live Video Feed -->
            <div class="flex-1">
                <div class="bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700">
                    <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                        <h2 id="source-label" class="text-xl font-semibold">{{ source_label }}</h2>
                        <div class="flex gap-2 shrink-0">
                            <input id="video-file" type="file" accept="video/*" class="hidden">
                            <button id="upload-video" class="bg-green-600 hover:bg-green-500 disabled:opacity-50 px-4 py-2 rounded font-semibold">
                                Upload video &#8679;
                            </button>
                            <button id="next-video" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-semibold">
                                Next video &#9654;
                            </button>
                        </div>
                    </div>
                    <!-- Upload progress, hidden until a file is chosen -->
                    <div id="upload-status" class="hidden mb-4">
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div id="upload-bar" class="bg-green-500 h-2 rounded" style="width: 0%"></div>
                        </div>
                        <p id="upload-text" class="text-sm text-gray-300 mt-1"></p>
                    </div>
                    <!-- This img tag continuously loads the MJPEG stream from Flask -->
                    <img src="/video_feed" class="w-full rounded border border-gray-600" alt="Live Camera Feed">
                </div>
            </div>

            <!-- Right Column: Status & Logs -->
            <div class="w-full lg:w-1/3 flex flex-col gap-6">
                <!-- Live Status Banner -->
                <div id="status-banner" class="rounded-lg p-6 shadow-lg text-center border-2 border-gray-600 bg-gray-800 transition-colors duration-300">
                    <h2 class="text-sm uppercase tracking-wide text-gray-300 mb-1">Current Scan</h2>
                    <p id="status-text" class="text-2xl font-bold">Scanning...</p>
                </div>

                <!-- Database Entry Logs -->
                <div class="bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700 flex-1">
                    <h2 class="text-xl mb-4 font-semibold">Recent Entries</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-700 text-gray-300">
                                <tr>
                                    <th class="p-2 rounded-tl">Time</th>
                                    <th class="p-2">Plate</th>
                                    <th class="p-2 rounded-tr">Status</th>
                                </tr>
                            </thead>
                            <tbody id="log-table-body">
                                <!-- JavaScript will inject rows here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('next-video').addEventListener('click', () => fetch('/api/next', { method: 'POST' }));

        // Upload: XMLHttpRequest instead of fetch so we can show upload progress for big videos.
        const fileInput = document.getElementById('video-file');
        const uploadButton = document.getElementById('upload-video');
        uploadButton.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            const bar = document.getElementById('upload-bar');
            const text = document.getElementById('upload-text');
            document.getElementById('upload-status').classList.remove('hidden');
            uploadButton.disabled = true;

            const form = new FormData();
            form.append('video', file);
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload');
            xhr.upload.onprogress = (e) => {
                const percent = Math.round((e.loaded / e.total) * 100);
                bar.style.width = percent + '%';
                text.innerText = `Uploading ${file.name}... ${percent}%`;
            };
            const finish = (message, ok) => {
                text.innerText = message;
                text.className = 'text-sm mt-1 ' + (ok ? 'text-gray-300' : 'text-red-400');
                uploadButton.disabled = false;
                fileInput.value = '';
                if (ok) setTimeout(() => document.getElementById('upload-status').classList.add('hidden'), 4000);
            };
            xhr.onload = () => {
                if (xhr.status === 200) return finish(`Playing ${file.name}`, true);
                let error;
                try { error = JSON.parse(xhr.responseText).error; } catch (e) { /* not JSON */ }
                finish(`Upload failed: ${error || 'server error ' + xhr.status}`, false);
            };
            xhr.onerror = () => finish(
                'Upload failed: lost connection to the dashboard. Is app.py still running?', false);
            xhr.send(form);
        });

        // Poll the Python API every 1 second to get the latest DB logs and UI status
        setInterval(() => {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('status-text').innerText = data.error;
                        return;
                    }
                    document.getElementById('source-label').innerText = data.source_label;
                    // Update Status Banner
                    const banner = document.getElementById('status-banner');
                    const statusText = document.getElementById('status-text');
                    statusText.innerText = data.status_text;
                    
                    if (data.status_color === "green") {
                        banner.className = "rounded-lg p-6 shadow-lg text-center border-2 border-green-500 bg-green-900/50";
                    } else if (data.status_color === "red") {
                        banner.className = "rounded-lg p-6 shadow-lg text-center border-2 border-red-500 bg-red-900/50";
                    } else {
                        banner.className = "rounded-lg p-6 shadow-lg text-center border-2 border-gray-600 bg-gray-800";
                    }

                    // Update Table
                    const tbody = document.getElementById('log-table-body');
                    tbody.innerHTML = '';
                    data.logs.forEach(log => {
                        const statusBadge = log.status === 'Registered' 
                            ? `<span class="bg-green-600 px-2 py-1 rounded text-xs">Registered</span>`
                            : `<span class="bg-red-600 px-2 py-1 rounded text-xs">Visitor</span>`;
                        
                        tbody.innerHTML += `
                            <tr class="border-b border-gray-700">
                                <td class="p-2 text-gray-400">${log.time}</td>
                                <td class="p-2 font-mono font-bold">${log.plate}</td>
                                <td class="p-2">${statusBadge}</td>
                            </tr>
                        `;
                    });
                });
        }, 1000);
    </script>
</body>
</html>
