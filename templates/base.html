<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UMPSA Gate ALPR{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <header class="border-b border-slate-800 bg-slate-900/80">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-xl font-bold text-sky-400">UMPSA Campus Gate Security</h1>
                <p class="text-xs text-slate-400">Automated License Plate Recognition &middot; Admin Dashboard</p>
            </div>
            <nav class="flex gap-1 text-sm font-semibold">
                <a href="/" class="px-3 py-2 rounded {{ 'bg-sky-600 text-white' if request.path == '/' else 'text-slate-300 hover:bg-slate-800' }}">Live Monitor</a>
                <a href="/records" class="px-3 py-2 rounded {{ 'bg-sky-600 text-white' if request.path == '/records' else 'text-slate-300 hover:bg-slate-800' }}">Records</a>
            </nav>
            <div class="text-right">
                <p id="clock-time" class="text-lg font-mono font-semibold"></p>
                <p id="clock-date" class="text-xs text-slate-400"></p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Escapes text before it goes into innerHTML (names and plates come from the database).
        function esc(value) {
            const div = document.createElement('div');
            div.textContent = value ?? '';
            return div.innerHTML;
        }

        function statusBadge(status) {
            return status === 'Registered'
                ? '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300">Registered</span>'
                : '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300">Visitor</span>';
        }

        function tickClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-GB');
            document.getElementById('clock-date').textContent =
                now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        tickClock();
        setInterval(tickClock, 1000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
